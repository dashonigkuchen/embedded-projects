esphome:
  name: deskrelay
  on_boot:
    priority: 800
    then:
      - output.turn_on: relay_oe

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Deskrelay Fallback Hotspot"
    password: "tFKp4YKPXn0m"

captive_portal:

# Output enable pin
output:
  - platform: gpio
    pin: GPIO5
    id: relay_oe

sn74hc595:
  - id: shift_register
    data_pin: GPIO14
    clock_pin: GPIO13
    latch_pin: GPIO12
    sr_count: 2

switch:
  - platform: gpio
    name: "Relay 1"
    pin: { sn74hc595: shift_register, number: 0 }
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "Relay 2"
    pin: { sn74hc595: shift_register, number: 1 }
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "Relay 3"
