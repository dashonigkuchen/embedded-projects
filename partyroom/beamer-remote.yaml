esphome:
  name: beamer-remote
  friendly_name: Beamer IR Remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".fritz.box"
  ap:
    ssid: beamer-remote
    password: !secret wifi_password

# Enable web server for OTA updates
web_server:
  port: 80

ota:
  - platform: web_server

# ------------------------------------------------------
# IR Receiver (only needed for initial setup)
# ------------------------------------------------------
#remote_receiver:
#  pin:
#    number: GPIO14
#    inverted: true
#    mode:
#      input: true
#      pullup: true
#  dump: nec

# ------------------------------------------------------
# IR SENDER
# ------------------------------------------------------
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

# ------------------------------------------------------
# HOME ASSISTANT BUTTONS
# ------------------------------------------------------
button:
  - platform: template
    name: "Optoma Power On"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xCD32
          command: 0xD12E
    icon: "mdi:power-on"

  - platform: template
    name: "Optoma Power Off"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xCD32
          command: 0xD02F
    icon: "mdi:power-off"