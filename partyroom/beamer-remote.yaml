esphome:
  name: beamer-remote
  friendly_name: Beamer IR Remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: 3.1
      sram1_as_iram: true

logger:
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".fritz.box"
  ap:
    ssid: beamer-remote
    password: !secret wifi_password

# Enable web server for OTA updates
web_server:
  port: 80
  local: true

ota:
  - platform: web_server

# ------------------------------------------------------
# BLUETOOTH PROXY (for Shelly BLU Button 4)
# ------------------------------------------------------
esp32_ble_tracker:
bluetooth_proxy:
  active: true

# ------------------------------------------------------
# IR Receiver (only needed for initial setup)
# ------------------------------------------------------
#remote_receiver:
#  pin:
#    number: GPIO14
#    inverted: true
#    mode:
#      input: true
#      pullup: true
#  dump: nec

# ------------------------------------------------------
# IR SENDER
# ------------------------------------------------------
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

# ------------------------------------------------------
# HOME ASSISTANT BUTTONS
# ------------------------------------------------------
button:
  - platform: template
    name: "Power"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xCD32
          command: 0xFD02
    icon: "mdi:power"